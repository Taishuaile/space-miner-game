<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>§”™≈±ƒƒq - Space Miner</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #0f0c29;
            --bg-gradient: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
            --text: #ffffff;
            --panel-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)), radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: starMove 100s linear infinite;
            opacity: 0.6;
        }

        @keyframes starMove {
            from { background-position: 0 0; }
            to { background-position: 0 1000px; }
        }

        body {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .center-area {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .shop-area {
            flex: 1;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            max-width: 400px;
            z-index: 20;
        }

        .planet-container {
            position: relative;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
            transition: transform 0.1s ease-out;
        }

        .planet {
            font-size: 150px;
            filter: drop-shadow(0 0 30px rgba(108, 92, 231, 0.6));
            transition: all 0.1s ease-out;
            transform-origin: center center;
            will-change: transform, filter, opacity;
        }

        .planet-container.clicked {
            transform: scale(0.92);
        }

        .planet-flash {
            animation: planetFlash 0.25s ease-out;
        }

        @keyframes planetFlash {
            0% { filter: drop-shadow(0 0 30px rgba(108, 92, 231, 0.6)) brightness(1); }
            50% { filter: drop-shadow(0 0 100px rgba(162, 155, 254, 1)) brightness(1.6); }
            100% { filter: drop-shadow(0 0 30px rgba(108, 92, 231, 0.6)) brightness(1); }
        }

        .click-particle {
            position: absolute;
            pointer-events: none;
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            animation: particleFloat 0.8s ease-out forwards;
            z-index: 100;
            user-select: none;
        }

        @keyframes particleFloat {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -120px) scale(1.3); }
        }

        .orbit-container {
            position: absolute;
            width: 300px;
            height: 300px;
            pointer-events: none;
            z-index: 5;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .orbit-item {
            position: absolute;
            font-size: 28px;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
            left: 0;
            top: 0;
            transform-origin: center center;
            transition: transform 0.1s linear;
        }

        .side-items-container {
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding: 15px;
          background: rgba(255, 255, 255, 0.05);
          border-radius: 15px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          width: 100%;
          max-width: 600px;
          max-height: 70vh;
          overflow-y: auto;
          animation: floatItems 4s ease-in-out infinite;
          margin-top: -80px;
        }

        .side-items-container::-webkit-scrollbar {
            width: 6px;
        }

        .side-items-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .side-items-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .side-items-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .gold-control {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        .gold-control h3 {
            margin: 0;
            font-size: 14px;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .gold-toggle {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid gold;
            color: gold;
            padding: 4px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .gold-toggle:hover {
            background: rgba(255, 215, 0, 0.4);
        }

        .gold-toggle.active {
            background: gold;
            color: #000;
        }

        .upgrade-item.best-cp {
            border: 2px solid #ff4757;
            box-shadow: 0 0 15px rgba(255, 71, 87, 0.4);
            animation: bestCpPulse 2s infinite;
            position: relative;
        }

        .upgrade-item.best-cp::before {
            content: '≥Ã®Œ CP';
            position: absolute;
            top: -10px;
            right: 10px;
            background: #ff4757;
            color: white;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        @keyframes bestCpPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.6); }
            50% { box-shadow: 0 0 0 8px rgba(255, 71, 87, 0); }
        }

        .gold-shop-container {
            display: flex;
            gap: 10px;
            z-index: 100;
            background: rgba(255, 215, 0, 0.08);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            margin-bottom: 15px;
            overflow-x: auto;
            min-height: 70px;
            flex-wrap: wrap;
            align-content: flex-start;
            transition: all 0.3s;

        .gold-shop-container.hidden {
            display: none;
        }

        .gold-shop-item {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 4px;
            border-radius: 10px;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            transition: all 0.3s;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .gold-shop-item:hover {
            background: rgba(255, 215, 0, 0.3);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        .gold-shop-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .gold-shop-item.purchased {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.28);
            cursor: default;
            filter: grayscale(0.28) brightness(0.92);
        }

        .gold-shop-item.purchased:hover {
            transform: none;
        }

        .shop-tooltip {
            position: fixed;
            z-index: 99999;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.94);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre-line;
            max-width: 320px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.08s ease, transform 0.08s ease;
        }

        .shop-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gold-icon {
            font-size: 16px;
            filter: drop-shadow(0 0 8px gold) brightness(1.3);
            animation: goldPulse 2s ease-in-out infinite;
            line-height: 1;
        }

        .gold-cost {
            font-size: 7px;
            color: gold;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 1px 3px;
            border-radius: 3px;
            white-space: nowrap;
            position: absolute;
            left: 50%;
            bottom: 2px;
            transform: translateX(-50%);
            max-width: calc(100% - 4px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gold-shop-check {
            position: absolute;
            top: 1px;
            right: 1px;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.72);
            color: #7dff9b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(125, 255, 155, 0.4);
        }

        @keyframes goldPulse {
            0%, 100% { filter: drop-shadow(0 0 8px gold) brightness(1.3); }
            50% { filter: drop-shadow(0 0 15px gold) brightness(1.5); }
        }

        @keyframes floatItems {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .side-item-group {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          min-height: 80px; /* ?üÂ?È´òÂ∫¶?†ÂÄ?*/
          max-height: 160px; /* ?êÂà∂?ÆÁ??ìÂÖ∑?ÑÊ?Â§ßÈ?Â∫?*/
          padding: 15px;
          background: rgba(0, 0, 0, 0.25);
          border-radius: 8px;
          align-items: center;
          justify-content: center;
          border: 1px solid rgba(255, 255, 255, 0.05);
          overflow-y: auto; /* ?∂ÂÖßÂÆπÈ?Â§öÊ?È°ØÁ§∫?ÇÁõ¥ÊªæÂ?Ê¢?*/
          overflow-x: hidden; /* ?±Ë?Ê∞¥Âπ≥Ê∫¢Âá∫ */
        }

        /* ?πÊ??ìÂÖ∑ÁµÑÊ®£Âº?*/
        .side-item-group.special-group {
          border: 2px solid #cd7f32; /* ?ÖËâ≤ */
          background: rgba(205, 127, 50, 0.1);
        }

        .side-item-group.special-group.silver {
          border: 2px solid #c0c0c0; /* ?Ä??*/
          background: rgba(192, 192, 192, 0.1);

        .side-item-group.special-group.gold {
          border: 2px solid #ffd700; /* ?ëËâ≤ */
          background: rgba(255, 215, 0, 0.1);
          box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .side-item-group.special-title {
          width: 100%;
          font-size: 13px;
          font-weight: bold;
          margin-bottom: 6px;
          text-align: center;
          padding: 4px;
          border-radius: 4px;

        .side-item-group.special-group .special-title {
          color: #cd7f32;
          background: rgba(205, 127, 50, 0.2);
        }

        .side-item-group.special-group.silver .special-title {
          color: #c0c0c0;
          background: rgba(192, 192, 192, 0.2);
        }

        .side-item-group.special-group.gold .special-title {
          color: #ffd700;
          background: rgba(255, 215, 0, 0.2);
        }

        /* ?™Â?Áæ©ÂñÆÁµÑÂÖß?ÑÊªæ?ïÊ?Ê®?? */
        .side-item-group::-webkit-scrollbar {
          width: 4px;
        }

        .side-item-group::-webkit-scrollbar-track {
          background: rgba(255, 255, 255, 0.05);
          border-radius: 2px;
        }

        .side-item-group::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.2);
          border-radius: 2px;
        }

        .side-item-group::-webkit-scrollbar-thumb:hover {
          background: rgba(255, 255, 255, 0.4);
        }

        /* ?™Â?Áæ©ÂñÆÁµÑÂÖß?ÑÊªæ?ïÊ?Ê®?? */
        .side-item-group::-webkit-scrollbar {
          width: 4px;
        }

        .side-item-group::-webkit-scrollbar-track {
          background: rgba(255, 255, 255, 0.05);
          border-radius: 2px;
        }

        .side-item-group::-webkit-scrollbar-thumb {
          background: rgba(255, 255, 255, 0.2);
          border-radius: 2px;
        }

        .side-item-group::-webkit-scrollbar-thumb:hover {
          background: rgba(255, 255, 255, 0.4);
        }

        .side-item {
            font-size: 32px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.6));
            animation: sideAppear 0.4s ease-out;
            transition: transform 0.2s;
        }

        .side-item:hover {
            transform: scale(1.15);
        }

        @keyframes sideAppear {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        .score-container {
          text-align: center;
          margin-bottom: 100px;
          position: relative;
          z-index: 15;
          transform: translateY(-80px);
        }

        #score {
            font-size: 3.5rem;
            font-weight: bold;
            text-shadow: 0 0 20px var(--primary);
        }

        .per-sec {
            font-size: 1.2rem;
            color: var(--secondary);
            margin-top: 5px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            text-align: center;
        }

        .upgrade-item {
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
        }

        .upgrade-item .tooltip {
            visibility: hidden;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            white-space: nowrap;
            z-index: 1000;
            margin-bottom: 10px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border: 1px solid rgba(108, 92, 231, 0.5);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            max-width: 300px;
            line-height: 1.5;
        }

        .upgrade-item .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 6px;
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.95) transparent transparent transparent;
        }

        .upgrade-item:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .upgrade-item:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--secondary);
            transform: translateX(-5px);
        }

        .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);

        .icon {

        .count-badge {

            text-align: right;
            background: rgba(0,0,0,0.4);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .reset-btn {
            margin-top: auto;
            background: #ff7675;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
            width: 100%;
        }

        .reset-btn:hover {
            background: #d63031;
        }

        .control-panel {
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 50;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            width: 260px;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            html, body {
                width: 100%;
                max-width: 100%;
            }
            body {
                flex-direction: column;
                height: auto;

                overflow-x: hidden;

            .game-area {
